name: Package and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching manifest.yaml, for example v0.3.3
        required: true
        default: v0.3.3
        type: string

permissions:
  contents: read

concurrency:
  group: crystalflow-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DIFY_CLI_VERSION: 0.6.1
      DIFY_CLI_SHA256: a8495a4392e377737e7166e1f7afb0b40bc8cc5fa4d44eaa65c08e60c679d7d5
      PACKAGE_NAME: crystalflow.difypkg
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v0.3.3; got $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Resolve release source
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --tags origin \
            "refs/tags/$RELEASE_TAG" >/dev/null 2>&1
          tag_status=$?
          set -e
          case "$tag_status" in
            0)
              git fetch --force --depth=1 origin \
                "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
              git checkout --detach "refs/tags/$RELEASE_TAG"
              ;;
            2)
              ;;
            *)
              echo "Could not check whether release tag $RELEASE_TAG exists" >&2
              exit "$tag_status"
              ;;
          esac

      - name: Validate manifest version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(awk '$1 == "version:" { print $2; exit }' manifest.yaml)"
          release_version="${RELEASE_TAG#v}"
          if [[ -z "$manifest_version" || "$release_version" != "$manifest_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match manifest version $manifest_version" >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run release checks
        run: |
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .

      - name: Download pinned official Dify CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dify-cli"
          gh release download "$DIFY_CLI_VERSION" \
            --repo langgenius/dify-plugin-daemon \
            --pattern dify-plugin-linux-amd64 \
            --dir "$RUNNER_TEMP/dify-cli"
          mv "$RUNNER_TEMP/dify-cli/dify-plugin-linux-amd64" "$RUNNER_TEMP/dify-cli/dify"
          echo "$DIFY_CLI_SHA256  $RUNNER_TEMP/dify-cli/dify" | sha256sum --check
          chmod +x "$RUNNER_TEMP/dify-cli/dify"
          "$RUNNER_TEMP/dify-cli/dify" version

      - name: Package plugin
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/package-output"
          mkdir -p "$package_dir"
          cd "$package_dir"
          "$RUNNER_TEMP/dify-cli/dify" plugin package "$GITHUB_WORKSPACE"
          package_path="$(find "$package_dir" -maxdepth 1 -type f -name '*.difypkg' -print -quit)"
          if [[ -z "$package_path" ]]; then
            echo "Dify CLI did not create a .difypkg file" >&2
            exit 1
          fi
          mv "$package_path" "$GITHUB_WORKSPACE/$PACKAGE_NAME"
          cd "$GITHUB_WORKSPACE"
          test -s "$PACKAGE_NAME"
          sha256sum "$PACKAGE_NAME"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystalflow-${{ env.RELEASE_TAG }}
          path: ${{ env.PACKAGE_NAME }}
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PACKAGE_NAME: crystalflow.difypkg
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Download packaged plugin
        uses: actions/download-artifact@v4
        with:
          name: crystalflow-${{ env.RELEASE_TAG }}

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PACKAGE_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          elif gh api --silent \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"; then
            gh release create "$RELEASE_TAG" "$PACKAGE_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "CrystalFlow $RELEASE_TAG" \
              --generate-notes
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "CrystalFlow $RELEASE_TAG" \
              --generate-notes
          fi
