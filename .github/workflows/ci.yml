name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Unit tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
